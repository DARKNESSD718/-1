<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دردشة الأصدقاء الفورية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            background-color: #1e293b;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        @media (min-width: 480px) {
            .chat-container {
                height: 85vh;
                border-radius: 16px;
                border: 1px solid #334155;
            }
        }
        .chat-header {
            padding: 16px 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }
        .chat-info h2 { font-size: 1.1rem; font-weight: 700; }
        .chat-info p { font-size: 0.8rem; color: #22c55e; display: flex; align-items: center; gap: 5px; }
        .chat-info p::before { content: ''; width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            position: relative;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.received { background-color: #334155; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.sent { background-color: #6366f1; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message .sender-name { font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; color: #cbd5e1; display: block; }
        .message .time { font-size: 0.65rem; color: rgba(255, 255, 255, 0.7); float: left; margin-top: 5px; margin-right: 8px; }
        
        .chat-input-area {
            padding: 15px 20px;
            background-color: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
            border-bottom-left-radius: inherit;
            border-bottom-right-radius: inherit;
        }
        .chat-input-area input {
            flex: 1;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 15px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-area input:focus { border-color: #6366f1; }
        .chat-input-area button {
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .chat-input-area button:hover { background-color: #4f46e5; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 3px; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
            <div class="chat-info">
                <h2>دردشة الأصدقاء</h2>
                <p>متصل الآن</p>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
            <button id="sendButton"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // إعدادات الاتصال بـ Supabase الخاصة بك
        const SUPABASE_URL = 'https://ialhdnjddiepfsqhntsd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-pIKHGpAI4RSVpPoLuNpDg_H02e6bgd';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const messagesContainer = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        // سؤال المستخدم عن اسمه عند فتح الدردشة
        const myName = prompt("أدخل اسمك لتبدأ الدردشة:") || "زائر";

        function appendMessage(sender, text, createdAt) {
            const isMe = (sender === myName);
            
            let timeString = "الآن";
            if(createdAt) {
                const date = new Date(createdAt);
                timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', isMe ? 'sent' : 'received');
            
            messageDiv.innerHTML = `
                <span class="sender-name">${sender}</span>
                ${text}
                <span class="time">${timeString}</span>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // جلب الرسائل القديمة عند الدخول
        async function fetchOldMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('خطأ في جلب الرسائل:', error);
                return;
            }

            messagesContainer.innerHTML = '';
            if(data) {
                data.forEach(msg => {
                    appendMessage(msg.sender, msg.message, msg.created_at);
                });
            }
        }

        // إرسال رسالة جديدة
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;

            messageInput.value = "";

            const { error } = await supabaseClient
                .from('messages')
                .insert([
                    { sender: myName, message: text }
                ]);

            if (error) {
                alert('فشل إرسال الرسالة: ' + error.message);
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // الاستماع الفوري للرسائل الجديدة (Realtime)
        supabaseClient
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                const newMessage = payload.new;
                appendMessage(newMessage.sender, newMessage.message, newMessage.created_at);
            })
            .subscribe();

        // تنفيذ جلب الرسائل عند تحميل الصفحة
        fetchOldMessages();
    </script>
</body>
</html>
