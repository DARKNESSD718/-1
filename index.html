<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد ذكي حر</title>
    <style>
        :root {
            --bg-color: #343541;
            --chat-bg: #444654;
            --text-color: #ececf1;
            --input-bg: #40414f;
            --border-color: #565869;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--chat-bg);
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 20px;
            padding-right: 20px;
        }
        .api-key-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .message {
            max-width: 80%;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message {
            background-color: var(--bg-color);
            align-self: flex-end;
            border: 1px solid var(--border-color);
        }
        .ai-message {
            background-color: var(--chat-bg);
            align-self: flex-start;
        }
        .loading-message {
            color: #8e8ea0;
            font-style: italic;
        }
        #input-container {
            padding: 20px;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--border-color);
        }
        #chat-form {
            width: 100%;
            max-width: 800px;
            display: flex;
            background-color: var(--input-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 5px;
        }
        #user-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            padding: 10px;
            font-size: 1rem;
            outline: none;
        }
        button[type="submit"] {
            background-color: #10a37f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button[type="submit"]:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <header>
        <span>مساعد ذكي حر</span>
        <button class="api-key-btn" onclick="showApiKeyInfo()">
            معلومات المفتاح
        </button>
    </header>

    <div id="chat-container">
        <div class="message ai-message">
            أهلاً بك! أنا ذكاؤك الاصطناعي السريع. يمكنك بدء الدردشة الآن.
        </div>
    </div>

    <div id="input-container">
        <form id="chat-form">
            <input
                type="text"
                id="user-input"
                placeholder="اكتب رسالتك هنا..."
                autocomplete="off"
                required
            >
            <button type="submit">إرسال</button>
        </form>
    </div>

    <script>

        // =====================================================
        // 🔑 مفتاح Gemini
        // =====================================================

        const apiKey = "AQ.Ab8RN6IIkYmbjQ8z-H2c1GcbnypPh-IcLcIQYGC8PgDF_KY2FQ";


        // =====================================================
        // النظام
        // =====================================================

        const chatContainer =
            document.getElementById('chat-container');

        const chatForm =
            document.getElementById('chat-form');

        const userInput =
            document.getElementById('user-input');


        // =====================================================
        // زر معلومات المفتاح
        // =====================================================

        function showApiKeyInfo() {
            alert("التطبيق يعمل بمفتاح API عام وثابت ومضبوط مسبقاً.");
        }


        // =====================================================
        // إضافة رسالة
        // =====================================================

        function appendMessage(
            text,
            sender,
            isLoading = false
        ) {

            const messageDiv =
                document.createElement('div');

            messageDiv.classList.add('message');

            messageDiv.classList.add(
                sender === 'user'
                    ? 'user-message'
                    : 'ai-message'
            );

            if (isLoading) {
                messageDiv.classList.add(
                    'loading-message'
                );
            }

            messageDiv.textContent = text;

            chatContainer.appendChild(
                messageDiv
            );

            chatContainer.scrollTop =
                chatContainer.scrollHeight;

            return messageDiv;
        }


        // =====================================================
        // سجل المحادثة
        // =====================================================

        let chatHistory = [];


        // =====================================================
        // إرسال الرسالة
        // =====================================================

        chatForm.addEventListener(
            'submit',
            async function(e) {

                e.preventDefault();

                const text =
                    userInput.value.trim();

                if (!text) return;


                // رسالة المستخدم

                appendMessage(
                    text,
                    'user'
                );

                userInput.value = '';


                // رسالة الانتظار

                const loadingDiv =
                    appendMessage(
                        "جاري التفكير...",
                        'ai',
                        true
                    );


                try {

                    const recentHistory = chatHistory.slice(-4);

                    // استدعاء الـ API مع تمرير المفتاح في الـ URL بالطريقة القياسية
                    const response =
                        await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify({

                                    contents: [

                                        ...recentHistory,

                                        {
                                            role: "user",

                                            parts: [
                                                {
                                                    text: text
                                                }
                                            ]
                                        }

                                    ],
                                    generationConfig: {
                                        maxOutputTokens: 800,
                                        temperature: 0.7
                                    }

                                })
                            }
                        );


                    const data =
                        await response.json();


                    // إزالة الانتظار

                    if (
                        loadingDiv &&
                        loadingDiv.parentNode
                    ) {

                        loadingDiv.parentNode
                            .removeChild(
                                loadingDiv
                            );
                    }


                    // معالجة الخطأ

                    if (!response.ok) {

                        const errorMessage =
                            data?.error?.message ||
                            "حدث خطأ غير معروف.";

                        appendMessage(
                            "حدث خطأ من Gemini:\n" +
                            errorMessage,
                            'ai'
                        );

                        console.error(
                            "Gemini API Error:",
                            data
                        );

                        return;
                    }


                    // استخراج الرد

                    if (
                        data.candidates &&
                        data.candidates[0] &&
                        data.candidates[0].content &&
                        data.candidates[0].content.parts &&
                        data.candidates[0].content.parts[0]
                    ) {

                        const aiReply =
                            data.candidates[0]
                                .content
                                .parts[0]
                                .text;


                        appendMessage(
                            aiReply,
                            'ai'
                        );


                        // حفظ رسالة المستخدم

                        chatHistory.push({

                            role: "user",

                            parts: [
                                {
                                    text: text
                                }
                            ]

                        });


                        // حفظ رد الذكاء الاصطناعي

                        chatHistory.push({

                            role: "model",

                            parts: [
                                {
                                    text: aiReply
                                }
                            ]

                        });

                    }

                    else {

                        appendMessage(
                            "لم يتم الحصول على رد من Gemini.",
                            'ai'
                        );

                        console.error(
                            "Unexpected response:",
                            data
                        );
                    }

                }

                catch (error) {

                    if (
                        loadingDiv &&
                        loadingDiv.parentNode
                    ) {

                        loadingDiv.parentNode
                            .removeChild(
                                loadingDiv
                            );
                    }

                    appendMessage(
                        "خطأ في الاتصال. تأكد من اتصال الإنترنت.",
                        'ai'
                    );

                    console.error(
                        "Connection error:",
                        error
                    );

                }

            }
        );

    </script>

</body>
</html>
